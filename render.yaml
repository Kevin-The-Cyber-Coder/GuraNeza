# Render Blueprint for the GuraNeza API.
# The frontend is already hosted at https://guraneza-ja1a.onrender.com/.
services:
  - type: web
    name: guraneza-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_URL
        value: https://guraneza-ja1a.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: GuraNeza Admin

  # Frontend Static Site. The name must match the existing service in Render.
  # The rewrite rule makes React Router deep links (/register, /login, /shop) work.
  - type: web
    name: guraneza-ja1a
    runtime: static
    branch: main
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://guraneza-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
